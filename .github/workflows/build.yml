name: Build Unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up release signing test runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Xcode version
        run: |
          xcodebuild -version

      - name: Verify protected download CryptoKit interoperability
        run: |
          swiftc ThreeOneOSFive/helpers/AstraServerTrust.swift \
            ThreeOneOSFive/helpers/SecureAPIClient.swift \
            ThreeOneOSFive/helpers/NetworkAccessGate.swift \
            ThreeOneOSFive/helpers/ServerSignatureVerifier.swift \
            ThreeOneOSFive/helpers/ProtectedArtifactDecoder.swift \
            Tests/ProtectedArtifactSelfCheck.swift -o "$RUNNER_TEMP/astra-security-selfcheck"
          "$RUNNER_TEMP/astra-security-selfcheck" Tests/Fixtures/artifact_crypto_v1.json

      - name: Verify license-scoped device identity and migration
        run: |
          swiftc ThreeOneOSFive/helpers/DeviceIdentityService.swift \
            Tests/DeviceIdentitySelfCheck.swift -o "$RUNNER_TEMP/astra-identity-selfcheck"
          "$RUNNER_TEMP/astra-identity-selfcheck"

      - name: Verify committed patched AirliftFFI
        run: |
          set -euo pipefail
          # Use the committed framework instead of rebuilding upstream Rust
          # sources in CI. Post-Build Verification checks the linked executable
          # for the required patch markers and rejects unsafe direct writes.
          # ALGetGrappaToken belongs to GrappaHelper.m in the app, not Rust's
          # archive. Check the actual defined FFI exports in both platform slices.
          for AIRLIFT_PLATFORM in ios-arm64 ios-arm64-simulator; do
            AIRLIFT_LIBRARY="Frameworks/AirliftFFI.xcframework/$AIRLIFT_PLATFORM/libairlift_ffi.a"
            AIRLIFT_SYMBOLS="$RUNNER_TEMP/airlift-$AIRLIFT_PLATFORM-symbols.txt"
            test -s "$AIRLIFT_LIBRARY"
            nm -gUj "$AIRLIFT_LIBRARY" > "$AIRLIFT_SYMBOLS"
            for AIRLIFT_SYMBOL in _al_exploit_run _al_exploit_write_dir _al_pairing_run_host; do
              grep -Fx "$AIRLIFT_SYMBOL" "$AIRLIFT_SYMBOLS"
            done
          done

      - name: Verify binary integrity embedder
        run: |
          python3 -m unittest discover -s Tests -p 'test_*.py' -v
          python3 -m py_compile ReleaseTools/macho_release.py ReleaseTools/seal_release.py
          swiftc ThreeOneOSFive/helpers/ProtectedOperationPolicy.swift \
            Tests/ProtectedOperationSelfCheck.swift -o "$RUNNER_TEMP/astra-operation-selfcheck"
          "$RUNNER_TEMP/astra-operation-selfcheck"

      - name: Build App (Unsigned)
        run: |
          mkdir -p build
          xcodebuild build \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build"

      - name: Post-Build Verification
        run: |
          APP_NAME=$(find build -maxdepth 1 -name "*.app" -type d | head -n 1)
          test -n "$APP_NAME"
          test -d "$APP_NAME"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_NAME/Info.plist")
          test -x "$APP_NAME/$EXECUTABLE"
          python3 tools/embed_integrity_hash.py --verify "$APP_NAME/$EXECUTABLE"
          python3 ReleaseTools/macho_release.py "$APP_NAME/$EXECUTABLE" > "$RUNNER_TEMP/astra-release-shape.json"
          if nm -gj "$APP_NAME/$EXECUTABLE" 2>/dev/null | grep -E "AntiTamper|JailbreakDetector|BinaryIntegrity|SignedReleaseIntegrity|ReleaseCommitBarrier|ProtectedDownloadService"; then
            echo "Security symbols leaked from stripped Release executable" >&2
            exit 1
          fi
          strings "$APP_NAME/$EXECUTABLE" | grep -F "RemoteXPC timed out after 6s"
          strings "$APP_NAME/$EXECUTABLE" | grep -F "timeout fallback trying raw RPPairing"
          strings "$APP_NAME/$EXECUTABLE" | grep -F "AirTraffic write timed out after 180s; operation cancelled"
          ! strings "$APP_NAME/$EXECUTABLE" | grep -F "proceeding with direct writeDirectory"
          echo "[build] Found App Bundle: $APP_NAME with Grappa helper linked"

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_NAME=$(find build -maxdepth 1 -name "*.app" -type d | head -n 1)
          cp -R "$APP_NAME" build/Payload/

          cd build
          zip -r Astra.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astra-Unsigned-IPA
          path: build/Astra.ipa
