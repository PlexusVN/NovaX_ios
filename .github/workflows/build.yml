name: Build Unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode version
        run: |
          xcodebuild -version

      - name: Verify AirliftFFI
        run: |
          test -f Frameworks/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a

      - name: Build patched AirliftFFI
        run: |
          git clone --filter=blob:none https://github.com/Mak5er/AirCard-iOS.git "$RUNNER_TEMP/AirCard-iOS"
          git -C "$RUNNER_TEMP/AirCard-iOS" checkout 40640c4d827aeab8d798285b57d24fcf6be070d0
          git -C "$RUNNER_TEMP/AirCard-iOS" apply "$GITHUB_WORKSPACE/patches/airlift-rsd-timeout-fallback.patch"
          DEVELOPER_DIR="$(xcode-select -p)" bash "$RUNNER_TEMP/AirCard-iOS/build-ios.sh"
          rm -rf Frameworks/AirliftFFI.xcframework
          cp -R "$RUNNER_TEMP/AirCard-iOS/AirliftFFI.xcframework" Frameworks/AirliftFFI.xcframework

      - name: Build App (Unsigned)
        run: |
          mkdir -p build
          xcodebuild build \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build"

      - name: Post-Build Verification
        run: |
          APP_NAME=$(find build -maxdepth 1 -name "*.app" -type d | head -n 1)
          test -n "$APP_NAME"
          test -d "$APP_NAME"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_NAME/Info.plist")
          test -x "$APP_NAME/$EXECUTABLE"
          nm -gj "$APP_NAME/$EXECUTABLE" | grep -Fx "_ALGetGrappaToken"
          strings "$APP_NAME/$EXECUTABLE" | grep -F "RemoteXPC timed out after 6s"
          strings "$APP_NAME/$EXECUTABLE" | grep -F "timeout fallback trying raw RPPairing"
          strings "$APP_NAME/$EXECUTABLE" | grep -F "AirTraffic write timed out after 180s; operation cancelled"
          ! strings "$APP_NAME/$EXECUTABLE" | grep -F "proceeding with direct writeDirectory"
          echo "[build] Found App Bundle: $APP_NAME with Grappa helper linked"

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_NAME=$(find build -maxdepth 1 -name "*.app" -type d | head -n 1)
          cp -R "$APP_NAME" build/Payload/

          cd build
          zip -r Astra.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astra-Unsigned-IPA
          path: build/Astra.ipa
