name: Build Unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode version
        run: |
          xcodebuild -version

      - name: Verify committed patched AirliftFFI
        run: |
          set -euo pipefail
          # AirliftFFI is committed as a prebuilt framework; avoid rebuilding
          # upstream Rust sources on every app build. Verify both archives carry
          # the expected patched behavior before linking the app.
          for LIB in Frameworks/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a Frameworks/AirliftFFI.xcframework/ios-arm64-simulator/libairlift_ffi.a; do
            test -s "$LIB"
            xcrun lipo -verify_arch arm64 "$LIB"
            STRINGS_FILE="$RUNNER_TEMP/$(basename "$(dirname "$LIB")").strings"
            strings "$LIB" > "$STRINGS_FILE"
            grep -F "RemoteXPC timed out after 6s" "$STRINGS_FILE"
            grep -F "timeout fallback trying raw RPPairing" "$STRINGS_FILE"
            grep -F "AirTraffic write timed out after 180s; operation cancelled" "$STRINGS_FILE"
            if grep -F "proceeding with direct writeDirectory" "$STRINGS_FILE"; then
              echo "Unexpected unsafe direct-write fallback in $LIB" >&2
              exit 1
            fi
          done

      - name: Build App (Unsigned)
        run: |
          mkdir -p build
          xcodebuild build \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build"

      - name: Post-Build Verification
        run: |
          APP_NAME=$(find build -maxdepth 1 -name "*.app" -type d | head -n 1)
          test -n "$APP_NAME"
          test -d "$APP_NAME"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_NAME/Info.plist")
          test -x "$APP_NAME/$EXECUTABLE"
          nm -gj "$APP_NAME/$EXECUTABLE" | grep -Fx "_ALGetGrappaToken"
          strings "$APP_NAME/$EXECUTABLE" | grep -F "RemoteXPC timed out after 6s"
          strings "$APP_NAME/$EXECUTABLE" | grep -F "timeout fallback trying raw RPPairing"
          strings "$APP_NAME/$EXECUTABLE" | grep -F "AirTraffic write timed out after 180s; operation cancelled"
          ! strings "$APP_NAME/$EXECUTABLE" | grep -F "proceeding with direct writeDirectory"
          echo "[build] Found App Bundle: $APP_NAME with Grappa helper linked"

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_NAME=$(find build -maxdepth 1 -name "*.app" -type d | head -n 1)
          cp -R "$APP_NAME" build/Payload/

          cd build
          zip -r Astra.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astra-Unsigned-IPA
          path: build/Astra.ipa
